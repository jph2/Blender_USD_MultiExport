name: 🐛 Bug Report
description: Report a bug or unexpected behavior in the Blender USD Stable Export addon
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below to help us understand and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: A clear description of what you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: A clear description of what actually happened
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Logs
      description: If applicable, add screenshots or error logs to help explain your problem
      placeholder: Paste error messages or attach screenshots
      render: markdown

  - type: dropdown
    id: blender-version
    attributes:
      label: Blender Version
      description: Which version of Blender are you using?
      options:
        - "4.2 LTS"
        - "4.3"
        - "4.4"
        - "5.0+"
        - "Other (please specify)"
    validations:
      required: true

  - type: input
    id: addon-version
    attributes:
      label: Addon Version
      description: Version of the Blender USD Stable Export addon
      placeholder: e.g., 1.0.0

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Which operating system are you using?
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: scene-info
    attributes:
      label: Scene Information
      description: Relevant information about your Blender scene (optional)
      placeholder: |
        - Number of objects: 
        - Number of collections:
        - Number of endpoints defined:
        - Scene size/complexity:

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: If you found a workaround, please describe it here
      placeholder: Any temporary solutions you've found...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem
      placeholder: Add any other context about the problem here...

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this bug hasn't been reported
          required: true
        - label: I have included all relevant information
          required: true
        - label: I have tested with the latest version of the addon
          required: false

